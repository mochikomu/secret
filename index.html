<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Видеоплеер — code.mp4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1115;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }

    .player-wrapper {
      width: 100%;
      max-width: 900px;
      background: #181b22;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    video {
      display: block;
      width: 100%;
      max-height: 75vh;
      background: #000;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #181b22;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #2c313d;
    }

    button.secondary:hover {
      background: #373d4c;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <video id="videoPlayer" playsinline controls preload="auto">
      <source src="./code.mp4" type="video/mp4" />
      Ваш браузер не поддерживает воспроизведение видео HTML5.
    </video>

    <div class="controls">
      <button id="playPauseBtn" type="button">Пауза</button>
      <button id="muteBtn" class="secondary" type="button">Включить звук</button>
      <span id="statusText" class="status">Загрузка...</span>
    </div>
  </div>

  <script>
    const video = document.getElementById('videoPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const statusText = document.getElementById('statusText');

    function updateUI() {
      playPauseBtn.textContent = video.paused ? 'Воспроизвести' : 'Пауза';
      muteBtn.textContent = video.muted ? 'Включить звук' : 'Выключить звук';
    }

    async function autoplayWithSound() {
      video.muted = false;
      try {
        await video.play();
        statusText.textContent = 'Воспроизведение со звуком';
      } catch (err) {
        // Браузер заблокировал автозапуск со звуком — пробуем запустить без звука
        video.muted = true;
        try {
          await video.play();
          statusText.textContent = 'Автозапуск со звуком заблокирован браузером (идёт без звука)';
        } catch (mutedErr) {
          statusText.textContent = 'Нажмите «Воспроизвести» для запуска видео';
        }
      }
      updateUI();
    }

    // Включаем звук при первом взаимодействии пользователя со страницей, если звук был выключен
    function unlockSoundOnInteraction() {
      if (video.muted && !video.paused) {
        video.muted = false;
        statusText.textContent = 'Воспроизведение со звуком';
        updateUI();
      }
      document.removeEventListener('click', unlockSoundOnInteraction);
      document.removeEventListener('keydown', unlockSoundOnInteraction);
    }

    playPauseBtn.addEventListener('click', async () => {
      if (video.paused) {
        await video.play();
      } else {
        video.pause();
      }
      updateUI();
    });

    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (!video.muted && video.paused) {
        video.play().catch(() => {});
      }
      statusText.textContent = video.muted ? 'Звук выключен' : 'Воспроизведение со звуком';
      updateUI();
    });

    video.addEventListener('play', updateUI);
    video.addEventListener('pause', updateUI);
    video.addEventListener('volumechange', updateUI);

    document.addEventListener('click', unlockSoundOnInteraction);
    document.addEventListener('keydown', unlockSoundOnInteraction);
    window.addEventListener('DOMContentLoaded', autoplayWithSound);
  </script>
</body>
</html>
