<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <video id="vid" src="video.mp4" autoplay muted loop playsinline controls></video>

  <script>
    const video = document.getElementById("vid");

    function unmuteVideo() {
      video.muted = false;
      video.play().catch(() => {});
    }

    document.addEventListener("pointerdown", unmuteVideo, { once: true });
  </script>
</body>
</html>
